services:
  nginx:
    build:
      context: ./docker/nginx
    container_name: nginx
    volumes:
      - ./docker/nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf
      - .:/var/www/app
    ports:
      - "${URL}:80:80"
    restart: always
    networks:
      - node_net
    depends_on:
      - php-fpm
   

  php-fpm:
    build:
      context: ./docker/php-fpm
      dockerfile: Dockerfile
    volumes:
      - .:/var/www/app
    environment:
      - "DB_PORT=${DB_PORT}"
      - "DB_HOST=${DB_HOST}"
    ports:
      - "8080:8080" #reverb port
    depends_on:
      - mysql
    networks:
      - node_net
    container_name: php-fpm

 

  mysql:
    platform: linux/x86_64
    image: mysql:8.0
    volumes:
      - ./docker/mysql/data:/var/lib/mysql
      - ./docker/mysql/news.sql:/docker-entrypoint-initdb.d/dump.sql

    environment:
      - "MYSQL_ROOT_PASSWORD=${DB_PASSWORD}"
      - "MYSQL_USER=${DB_USERNAME}"
      - "MYSQL_PASSWORD=${DB_PASSWORD}"
      - "MYSQL_DATABASE=${DB_DATABASE}"
    ports:
      - "3306:3306"
    networks:
      - node_net
    container_name: mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin
    environment:
      - PMA_HOST=mysql
      - PMA_ARBITRARY=1
    depends_on:
      - mysql
    restart: always
    ports:
      - 8082:80
    networks:
      - node_net
      
  node:
    image: node:23.0.0
    ports:
      - "3000:3000"
      - "5173:5173"
    volumes:
      - .:/var/www/app
    working_dir: /var/www/app
    tty: true
    container_name: node
    networks:
     - node_net
    
networks:
  node_net:
    driver: bridge
    name: node_net
    
